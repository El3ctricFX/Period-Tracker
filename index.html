<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cycle Dashboard · Compact Timeline + All Phases on Click</title>
    <style>
        :root {
            --bg: #05070a;
            --sidebar: #0a0d14;
            --card: #0f141e;
            --border: #1e2533;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --accent-blue: #00d2ff;
            --neon-pink: #ff2d75;
            --ovulation: #00ffaa;
            --luteal: #bc8cff;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR (desktop) --- */
        aside {
            width: 300px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .stats-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 40px 25px 20px 25px;
        }

        .section-label { 
            font-weight: 800; font-size: 0.7rem; color: var(--text-dim); 
            letter-spacing: 2px; margin-bottom: 30px; text-transform: uppercase;
        }
        
        .stat-group { margin-bottom: 35px; }
        .stat-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; display: block; }
        .stat-value { font-size: 1.6rem; font-weight: 800; color: var(--text-main); }

        .nav-tools {
            padding: 25px 25px 35px;
            border-top: 1px solid var(--border);
            background: var(--sidebar);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .tool-btn { 
            background: var(--card); border: 1px solid var(--border); color: var(--text-dim); 
            padding: 12px 16px; border-radius: 14px; cursor: pointer; font-size: 0.75rem; transition: 0.2s;
            text-align: left; font-weight: 600;
            width: 100%;
        }
        .tool-btn:hover { border-color: var(--accent-blue); color: var(--text-main); background: rgba(0,210,255,0.08); }

        /* --- MAIN DASHBOARD (compact) --- */
        main { flex: 1; padding: 40px 50px; overflow-y: auto; min-width: 0; }

        .dashboard-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 30px; margin-bottom: 40px; }

        .status-hero {
            background: var(--card); border: 1px solid var(--border); border-radius: 28px;
            padding: 40px; display: flex; flex-direction: column;
        }

        .hero-top { display: flex; align-items: center; gap: 35px; margin-bottom: 30px; flex-wrap: wrap; }

        .phase-indicator {
            width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--phase-color, var(--accent-blue));
            display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: var(--phase-color);
            box-shadow: 0 0 20px rgba(0,0,0,0.4), 0 0 10px var(--phase-color);
            flex-shrink: 0;
        }

        .status-text h2 { font-size: 3.2rem; margin: 0; letter-spacing: -1.5px; }
        .status-text p { color: var(--text-dim); margin: 12px 0 20px; font-size: 1.1rem; font-weight: 500; }
        
        .bio-marker { 
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(0,0,0,0.4); padding: 10px 18px; border-radius: 40px; 
            font-size: 0.75rem; font-weight: 800; color: var(--phase-color);
            border: 1px solid var(--phase-color); text-transform: uppercase; letter-spacing: 1.2px;
            cursor: pointer; transition: 0.2s;
        }
        .bio-marker:hover { background: var(--phase-color); color: #000; transform: translateY(-1px); }

        .prediction-strip { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; 
            padding: 25px 0; border-top: 1px solid var(--border);
        }
        .pred-box { display: flex; flex-direction: column; gap: 6px; }
        .pred-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        .pred-date { font-size: 1.15rem; font-weight: 700; color: var(--text-main); }

        /* --- COMPACT TIMELINE (tighter spacing, smaller dots) --- */
        .timeline-container {
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .timeline-track {
            display: flex;
            justify-content: space-between;
            position: relative;
            gap: 8px;
        }
        .timeline-track::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--border);
            z-index: 1;
        }
        .timeline-point {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 80px;
            flex-shrink: 0;
        }
        .dot {
            width: 16px;
            height: 16px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 50%;
            margin-bottom: 8px;
        }
        .timeline-point.active .dot {
            background: var(--dot-color);
            border-color: var(--dot-color);
            box-shadow: 0 0 12px var(--dot-color);
        }
        .timeline-point.passed .dot {
            background: var(--dot-color);
            border-color: var(--dot-color);
            opacity: 0.3;
        }
        .tp-label { font-size: 0.55rem; text-transform: uppercase; font-weight: 800; color: var(--text-dim); letter-spacing: 0.5px; }
        .tp-date { font-size: 0.65rem; color: var(--text-main); margin-top: 4px; white-space: nowrap; }

        .log-panel { background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 30px; }
        label { display: block; font-size: 0.65rem; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; font-weight: 700; }
        input[type="date"] {
            width: 100%; background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 14px; border-radius: 14px; font-family: inherit; font-size: 0.9rem; margin-bottom: 15px;
        }
        .btn-action { 
            width: 100%; background: var(--accent-blue); color: #000; border: none; padding: 16px; 
            border-radius: 16px; font-weight: 800; cursor: pointer; font-size: 0.85rem; text-transform: uppercase; margin-top: 10px;
        }
        .btn-end { background: var(--neon-pink); color: white; }

        /* Insight card - shows ALL phases */
        #insightCard {
            display: none; background: var(--card); border: 1px solid var(--phase-color); 
            border-radius: 28px; padding: 30px; margin-top: 20px; animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .all-phases-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 8px;
        }
        .phase-card {
            border-left: 4px solid;
            padding-left: 18px;
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            padding: 16px 18px;
        }
        .phase-card h4 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .phase-hormone {
            font-size: 0.65rem;
            background: rgba(255,255,255,0.08);
            padding: 4px 10px;
            border-radius: 40px;
            font-weight: normal;
        }
        .phase-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
            margin-top: 10px;
        }
        .phase-detail-item {
            font-size: 0.75rem;
        }
        .detail-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }
        .detail-text {
            color: var(--text-main);
            line-height: 1.4;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: var(--text-dim); font-size: 0.65rem; text-transform: uppercase; padding: 15px; border-bottom: 1px solid var(--border); }
        td { padding: 18px 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .date-range { font-weight: 600; color: var(--text-main); }
        .status-tag { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: rgba(255,255,255,0.05); }

        /* Compact X delete button */
        .delete-x {
            background: rgba(255,45,117,0.2);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
        }
        .delete-x:hover {
            background: var(--neon-pink);
            color: #000;
            transform: scale(1.02);
        }

        #jsonTerminal {
            position: fixed; right: -500px; top: 0; width: 450px; height: 100%;
            background: #06090f; border-left: 1px solid var(--border); padding: 30px;
            transition: 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1); z-index: 1000;
            box-shadow: -10px 0 25px rgba(0,0,0,0.5);
        }
        #jsonTerminal.open { right: 0; }
        textarea { width: 100%; height: 70%; background: #0a0c12; border: 1px solid #2a2f3a; color: var(--accent-blue); padding: 18px; font-family: monospace; border-radius: 18px; resize: vertical; }

        #importFileInput { display: none; }
        .toast-msg {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-blue);
            color: black;
            font-weight: bold;
            padding: 10px 22px;
            border-radius: 60px;
            z-index: 1100;
            animation: fadeOut 2s ease forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(20px); visibility: hidden; }
        }

        /* --- MOBILE & TABLET (breakpoint 1024px) --- */
        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                height: auto;
                overflow: auto;
            }
            aside {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .stats-scroll {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                padding: 16px 20px;
                overflow-x: auto;
                white-space: nowrap;
            }
            .section-label {
                width: 100%;
                margin-bottom: 6px;
            }
            .stat-group {
                margin-bottom: 0;
                display: inline-flex;
                align-items: baseline;
                gap: 8px;
                background: rgba(15,20,30,0.8);
                padding: 6px 14px;
                border-radius: 40px;
            }
            .stat-value { font-size: 1.1rem; }
            .nav-tools {
                flex-direction: row;
                padding: 12px 20px;
                border-top: none;
                gap: 8px;
                flex-wrap: wrap;
            }
            .tool-btn {
                width: auto;
                flex: 1;
                text-align: center;
                padding: 10px 12px;
                font-size: 0.7rem;
            }
            main {
                padding: 20px;
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .status-hero { padding: 24px; }
            .phase-indicator { width: 70px; height: 70px; font-size: 1.8rem; }
            .status-text h2 { font-size: 2rem; }
            .pred-date { font-size: 0.9rem; }
            .timeline-point { width: 70px; }
            .tp-date { white-space: normal; font-size: 0.55rem; }
            .phase-details { grid-template-columns: 1fr; gap: 12px; }
            #jsonTerminal { width: 90%; right: -90%; }
            #jsonTerminal.open { right: 0; }
        }
        @media (max-width: 480px) {
            .phase-indicator { width: 58px; height: 58px; }
            .status-text h2 { font-size: 1.6rem; }
            .timeline-point { width: 60px; }
            .tp-label { font-size: 0.5rem; }
        }
    </style>
</head>
<body>

<aside>
    <div class="stats-scroll">
        <div class="section-label">Averages</div>
        <div class="stat-group"><span class="stat-label">Full Cycle</span><div class="stat-value" id="avgCycle">--</div></div>
        <div class="stat-group"><span class="stat-label">Period Duration</span><div class="stat-value" id="avgDuration">--</div></div>
    </div>
    <div class="nav-tools">
        <button class="tool-btn" onclick="toggleTerminal()">✎ Edit Raw Data</button>
        <button class="tool-btn" onclick="exportData()">⬇️ Export Backup</button>
        <button class="tool-btn" id="importBtnTrigger">📂 Import Backup</button>
        <input type="file" id="importFileInput" accept="application/json">
        <button class="tool-btn" onclick="clearAllData()" style="color:#ff8a7a;">⟳ Reset All</button>
    </div>
</aside>

<main>
    <div class="dashboard-grid">
        <section class="status-hero">
            <div class="hero-top">
                <div class="phase-indicator" id="phaseIcon">☾</div>
                <div class="status-text">
                    <div class="bio-marker" id="hormoneMarker" onclick="toggleInsights()">System Ready</div>
                    <h2 id="countdownDisplay">Ready</h2>
                    <p id="phaseName">Awaiting Entry</p>
                </div>
            </div>
            <div class="prediction-strip">
                <div class="pred-box"><span class="pred-label" id="startPredLabel">Expected Next Period</span><span class="pred-date" id="nextPeriodDate">—</span></div>
                <div class="pred-box"><span class="pred-label" id="endPredLabel">Estimated End Date</span><span class="pred-date" id="nextEndDate">—</span></div>
            </div>
            <div class="timeline-container">
                <div class="timeline-track" id="phaseTimeline"></div>
            </div>
        </section>

        <section class="log-panel">
            <label>📅 Log Cycle Start</label>
            <input type="date" id="startInput">
            <label>🔚 End Date (optional)</label>
            <input type="date" id="endInput">
            <button class="btn-action" onclick="logEntry()">➕ Update Calendar</button>
            <button id="updateBtn" class="btn-action btn-end" style="display:none;" onclick="updateLatest()">✖ End Current Period</button>
        </section>
    </div>

    <!-- Insight card - shows ALL phases when clicked -->
    <div id="insightCard">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:15px; margin-bottom:20px;">
            <h3 id="insightTitle" style="margin:0; font-size:1.3rem;">All Cycle Phases</h3>
            <button onclick="closeInsights()" style="background:var(--bg); border:1px solid var(--border); color:var(--text-dim); padding:5px 12px; border-radius:6px; cursor:pointer;">CLOSE ✕</button>
        </div>
        <div id="allPhasesContainer" class="all-phases-grid">
            <!-- Dynamically filled with all 5 phases -->
        </div>
    </div>

    <div id="historySection">
        <div class="section-label">Cycle History</div>
        <table>
            <thead><tr><th>Timeline</th><th>Days</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="historyLog"></tbody>
        </table>
    </div>
</main>

<div id="jsonTerminal">
    <h3>📁 Developer Terminal</h3>
    <textarea id="jsonArea" placeholder="Edit JSON logs..."></textarea>
    <div style="display:flex; gap:12px; margin-top:24px;">
        <button class="tool-btn" style="flex:1; text-align:center" onclick="applyJson()">💾 Save Changes</button>
        <button class="tool-btn" style="flex:1; text-align:center" onclick="toggleTerminal()">Cancel</button>
    </div>
</div>

<script>
    let logs = JSON.parse(localStorage.getItem('periodLogs')) || [];
    let currentPhaseKey = 'MENSTRUAL';

    const PHASES = {
        MENSTRUAL: { 
            name: 'Menstrual Phase', color: 'var(--neon-pink)', icon: '☾', hormone: 'Progesterone Drop',
            mood: 'Turning inward, reflective, sometimes emotional. Honor your need for solitude.',
            energy: 'Lowest point. Your body needs rest, iron-rich foods, and warmth.',
            body: 'Cramping or bloating. Skin may be sensitive. Prioritize hydration.',
            activity: 'Light stretching, journaling, meditation, and early nights.'
        },
        FOLLICULAR: { 
            name: 'Follicular Phase', color: 'var(--accent-blue)', icon: '☽', hormone: 'Estrogen Rising',
            mood: 'Outgoing, creative, and mentally sharp. Optimism returns.',
            energy: 'Building steadily. You feel lighter and more capable every day.',
            body: 'Skin starts to glow. Metabolism is slightly slower. Great time for nutrient-dense meals.',
            activity: 'Starting new projects, social events, cardio, brainstorming.'
        },
        OVULATORY: { 
            name: 'Ovulatory Phase', color: 'var(--ovulation)', icon: '○', hormone: 'LH Surge',
            mood: 'Confident, flirtatious, high communication. Peak social drive.',
            energy: 'Peak performance. You can handle high-intensity workouts and complex tasks.',
            body: 'High libido. Peak fertility. Clear, bright skin. Heightened senses.',
            activity: 'Public speaking, heavy lifting, networking, dating, bold moves.'
        },
        LUTEAL: { 
            name: 'Luteal Phase', color: 'var(--luteal)', icon: '◑', hormone: 'Progesterone Peak',
            mood: 'Nesting, detail-oriented, but possibly irritable. Embrace introspection.',
            energy: 'Waning. You might feel "foggy" or easily winded. Rest when needed.',
            body: 'Oily skin or breakouts. Increased appetite. Metabolism speeds up.',
            activity: 'Organizing, deep cleaning, strength training, finishing tasks.'
        },
        LATE: { 
            name: 'Late Cycle (PMS)', color: '#cf2a2a', icon: '⚠', hormone: 'Delayed Cycle',
            mood: 'Sensitivity, impatience, or anxiety. Listen to your boundaries.',
            energy: 'Low resilience, fatigue may increase. Cancel non-essentials.',
            body: 'Bloating, breast tenderness, headaches possible.',
            activity: 'Hydration, light walking, restful yoga, self-compassion.'
        }
    };

    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerText = msg;
        toast.style.backgroundColor = isError ? '#e03a3a' : 'var(--accent-blue)';
        toast.style.color = isError ? 'white' : 'black';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }

    document.getElementById('importBtnTrigger').addEventListener('click', () => {
        document.getElementById('importFileInput').click();
    });
    document.getElementById('importFileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (Array.isArray(imported)) {
                    logs = imported;
                    save();
                    showToast(`✅ Imported ${logs.length} cycles`);
                } else throw new Error();
            } catch (err) {
                showToast("❌ Invalid backup file", true);
            }
            e.target.value = '';
        };
        reader.readAsText(file);
    });

    function exportData() {
        const blob = new Blob([JSON.stringify(logs, null, 2)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "cycle_backup.json";
        a.click();
        URL.revokeObjectURL(a.href);
        showToast("📁 Backup saved");
    }

    function clearAllData() {
        if (confirm("⚠️ Remove all cycle history? This cannot be undone.")) {
            logs = [];
            save();
            showToast("All data cleared.");
        }
    }

    // Render all phases in the insight card
    function renderAllPhases() {
        const container = document.getElementById('allPhasesContainer');
        if (!container) return;
        const phaseOrder = ['MENSTRUAL', 'FOLLICULAR', 'OVULATORY', 'LUTEAL', 'LATE'];
        let html = '';
        for (let key of phaseOrder) {
            const p = PHASES[key];
            if (!p) continue;
            html += `
                <div class="phase-card" style="border-left-color: ${p.color};">
                    <h4>
                        <span style="color: ${p.color};">${p.name}</span>
                        <span class="phase-hormone" style="color: ${p.color};">${p.hormone}</span>
                    </h4>
                    <div class="phase-details">
                        <div class="phase-detail-item">
                            <div class="detail-label">🧠 Mood & Mind</div>
                            <div class="detail-text">${p.mood}</div>
                        </div>
                        <div class="phase-detail-item">
                            <div class="detail-label">⚡ Energy Levels</div>
                            <div class="detail-text">${p.energy}</div>
                        </div>
                        <div class="phase-detail-item">
                            <div class="detail-label">💆 Skin & Body</div>
                            <div class="detail-text">${p.body}</div>
                        </div>
                        <div class="phase-detail-item">
                            <div class="detail-label">🎯 Best For</div>
                            <div class="detail-text">${p.activity}</div>
                        </div>
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function toggleInsights() {
        const card = document.getElementById('insightCard');
        const historyDiv = document.getElementById('historySection');
        if (card.style.display === 'block') {
            card.style.display = 'none';
            historyDiv.style.display = 'block';
        } else {
            // Render all phases before showing
            renderAllPhases();
            card.style.display = 'block';
            historyDiv.style.display = 'block';
            // Smooth scroll to card
            setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
        }
    }

    function closeInsights() {
        document.getElementById('insightCard').style.display = 'none';
    }

    function logEntry() {
        const start = document.getElementById('startInput').value;
        if (!start) { showToast("Select a start date", true); return; }
        const end = document.getElementById('endInput').value || null;
        logs.unshift({ id: Date.now(), start, end });
        logs.sort((a, b) => new Date(b.start) - new Date(a.start));
        save();
        document.getElementById('startInput').value = '';
        document.getElementById('endInput').value = '';
        showToast("Cycle added ✓");
    }

    function updateLatest() {
        const end = document.getElementById('endInput').value;
        if (!end) { showToast("Select an end date", true); return; }
        if (logs.length === 0) return;
        logs[0].end = end;
        save();
        document.getElementById('endInput').value = '';
        showToast("Period ended ✓");
    }

    function save() {
        localStorage.setItem('periodLogs', JSON.stringify(logs));
        updateUI();
    }

    function toggleTerminal() {
        const term = document.getElementById('jsonTerminal');
        term.classList.toggle('open');
        if (term.classList.contains('open')) {
            document.getElementById('jsonArea').value = JSON.stringify(logs, null, 2);
        }
    }

    function applyJson() {
        try {
            const parsed = JSON.parse(document.getElementById('jsonArea').value);
            if (!Array.isArray(parsed)) throw new Error();
            logs = parsed;
            save();
            toggleTerminal();
            showToast("Terminal changes applied.");
        } catch (e) {
            alert("Invalid JSON. Must be an array of cycle objects.");
        }
    }

    function formatDate(dateStr) {
        if (!dateStr) return "Ongoing";
        const d = new Date(dateStr + "T00:00:00");
        if (isNaN(d.getTime())) return "Invalid";
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function deleteEntry(id) {
        if (confirm("Remove this cycle?")) {
            logs = logs.filter(l => l.id !== id);
            save();
            showToast("Entry removed.");
        }
    }

    function updateUI() {
        const logContainer = document.getElementById('historyLog');
        logContainer.innerHTML = '';
        if (logs.length === 0) {
            document.getElementById('avgCycle').innerText = "28 Days";
            document.getElementById('avgDuration').innerText = "5 Days";
            document.getElementById('countdownDisplay').innerText = "📆 Add first log";
            document.getElementById('phaseName').innerText = "Log your period start";
            document.getElementById('nextPeriodDate').innerText = "—";
            document.getElementById('nextEndDate').innerText = "—";
            document.getElementById('updateBtn').style.display = "none";
            document.getElementById('hormoneMarker').innerHTML = "System Ready ⓘ";
            document.getElementById('phaseIcon').innerText = '☾';
            return;
        }

        let totalCycleGap = 0, cycleCount = 0;
        let totalDuration = 0, durCount = 0;
        logs.forEach((log, i) => {
            if (log.start && log.end) {
                const dur = (new Date(log.end + "T00:00:00") - new Date(log.start + "T00:00:00")) / 86400000 + 1;
                totalDuration += dur;
                durCount++;
            }
            if (i < logs.length - 1) {
                const gap = (new Date(logs[i].start + "T00:00:00") - new Date(logs[i+1].start + "T00:00:00")) / 86400000;
                if (gap > 0) { totalCycleGap += gap; cycleCount++; }
            }
        });

        const avgC = cycleCount > 0 ? Math.round(totalCycleGap / cycleCount) : 28;
        const avgD = durCount > 0 ? Math.round(totalDuration / durCount) : 5;
        document.getElementById('avgCycle').innerText = avgC + " Days";
        document.getElementById('avgDuration').innerText = avgD + " Days";

        const lastEntry = logs[0];
        const lastStart = new Date(lastEntry.start + "T00:00:00");
        const today = new Date(); today.setHours(0,0,0,0);
        const dayFromStart = Math.floor((today - lastStart) / 86400000) + 1;
        let activePeriod = (!lastEntry.end) || (today >= lastStart && today <= new Date(lastEntry.end + "T00:00:00"));

        const countdownEl = document.getElementById('countdownDisplay');
        if (activePeriod) {
            currentPhaseKey = 'MENSTRUAL';
            countdownEl.innerText = "Day " + dayFromStart + " of period";
        } else if (dayFromStart > avgC) {
            currentPhaseKey = 'LATE';
            countdownEl.innerText = (dayFromStart - avgC) + " Days Late";
        } else {
            const nextStart = new Date(lastStart); nextStart.setDate(lastStart.getDate() + avgC);
            const daysLeft = Math.ceil((nextStart - today) / 86400000);
            countdownEl.innerText = "Next in " + Math.max(0, daysLeft) + " Days";
            if (dayFromStart <= Math.floor(avgC - 16)) currentPhaseKey = 'FOLLICULAR';
            else if (dayFromStart <= Math.floor(avgC - 12)) currentPhaseKey = 'OVULATORY';
            else currentPhaseKey = 'LUTEAL';
        }

        const p = PHASES[currentPhaseKey] || PHASES.LUTEAL;
        document.getElementById('phaseIcon').innerText = p.icon;
        document.getElementById('phaseIcon').style.setProperty('--phase-color', p.color);
        document.getElementById('phaseName').innerText = p.name;
        document.getElementById('hormoneMarker').innerHTML = p.hormone + " ⓘ";
        document.getElementById('hormoneMarker').style.setProperty('--phase-color', p.color);

        const nextCycleStart = new Date(lastStart); nextCycleStart.setDate(lastStart.getDate() + avgC);
        if (activePeriod) {
            document.getElementById('startPredLabel').innerText = "Current Period Start";
            document.getElementById('nextPeriodDate').innerText = formatDate(lastEntry.start);
            const estEnd = new Date(lastStart); estEnd.setDate(lastStart.getDate() + (avgD - 1));
            document.getElementById('endPredLabel').innerText = "Est. End Date";
            document.getElementById('nextEndDate').innerText = formatDate(estEnd.toISOString().split('T')[0]);
        } else {
            document.getElementById('startPredLabel').innerText = "Expected Next Period";
            document.getElementById('nextPeriodDate').innerText = formatDate(nextCycleStart.toISOString().split('T')[0]);
            const nextEnd = new Date(nextCycleStart); nextEnd.setDate(nextCycleStart.getDate() + (avgD - 1));
            document.getElementById('endPredLabel').innerText = "Est. End Date";
            document.getElementById('nextEndDate').innerText = formatDate(nextEnd.toISOString().split('T')[0]);
        }

        const timelineDiv = document.getElementById('phaseTimeline');
        timelineDiv.innerHTML = '';
        const phasePoints = [
            { label: 'Menstrual', key: 'MENSTRUAL', date: new Date(lastStart) },
            { label: 'Follicular', key: 'FOLLICULAR', date: new Date(lastStart.getTime() + avgD * 86400000) },
            { label: 'Ovulation', key: 'OVULATORY', date: new Date(lastStart.getTime() + Math.max(avgC - 14, 6) * 86400000) },
            { label: 'Luteal', key: 'LUTEAL', date: new Date(lastStart.getTime() + Math.max(avgC - 10, 12) * 86400000) },
            { label: 'Next Cycle', key: 'NEXT', date: new Date(lastStart.getTime() + avgC * 86400000) }
        ];
        phasePoints.forEach(point => {
            const isPassed = today > point.date;
            const isActive = (currentPhaseKey === point.key) || (point.key === 'NEXT' && currentPhaseKey === 'LATE');
            const color = PHASES[point.key === 'NEXT' ? 'MENSTRUAL' : point.key]?.color || 'var(--accent-blue)';
            timelineDiv.innerHTML += `
                <div class="timeline-point ${isActive ? 'active' : ''} ${isPassed ? 'passed' : ''}" style="--dot-color: ${color}">
                    <div class="dot"></div>
                    <span class="tp-label">${point.label}</span>
                    <span class="tp-date">${formatDate(point.date.toISOString().split('T')[0])}</span>
                </div>
            `;
        });

        document.getElementById('updateBtn').style.display = (!logs[0]?.end && logs.length) ? "block" : "none";

        logs.forEach(log => {
            const row = document.createElement('tr');
            const durDays = log.end ? Math.floor((new Date(log.end + "T00:00:00") - new Date(log.start + "T00:00:00")) / 86400000) + 1 : "Ongoing";
            row.innerHTML = `
                <td class="date-range">${formatDate(log.start)} — ${formatDate(log.end)}</td>
                <td>${durDays}</td>
                <td><span class="status-tag" style="color:${log.end ? 'var(--text-dim)' : 'var(--neon-pink)'}">${log.end ? 'Finished' : 'Active'}</span></td>
                <td style="text-align:right;">
                    <button class="delete-x" onclick="deleteEntry(${log.id})" title="Delete">✕</button>
                </td>
            `;
            logContainer.appendChild(row);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('jsonTerminal').classList.remove('open');
        updateUI();
        document.getElementById('insightCard').style.display = 'none';
    });
    updateUI();
</script>
</body>
</html>
